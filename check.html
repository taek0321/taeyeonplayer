<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song checker · TAEYEON’s Music Archive</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root { --bg: #F7F5FC; --ink: #2A2350; --muted: #655E8C; --line: #D1CBE6; --ok: #2B8A3E; --bad: #C92A2A; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #17142A; --ink: #ECE9F8; --muted: #A9A3C9; --line: #353057; --ok: #69DB7C; --bad: #FF8787; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
h1 { margin: 0 0 6px; font-size: 1.6rem; }
#status { color: var(--muted); margin: 0 0 18px; }
h2 { font-size: 1.1rem; margin: 22px 0 8px; }
ul { list-style: none; padding: 0; margin: 0; }
li { padding: 8px 0; border-bottom: 1px solid var(--line); word-break: break-word; }
li small { display: block; color: var(--muted); }
.bad h2 { color: var(--bad); }
.ok h2 { color: var(--ok); }
details summary { cursor: pointer; }
.hint { color: var(--muted); font-size: 0.9rem; margin: -10px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Song checker</h1>
  <p id="status">Checking songs…</p>
  <p class="hint">Each song is checked twice: that the file exists, and that it actually plays. Run this on a computer for the most reliable results.</p>
  <section class="bad"><h2 id="missTitle"></h2><ul id="miss"></ul></section>
  <section class="bad"><h2 id="brokeTitle"></h2><ul id="broke"></ul></section>
  <section class="ok"><details><summary><h2 id="okTitle" style="display:inline"></h2></summary><ul id="ok"></ul></details></section>
</div>
<script src="songs.js"></script>
<script>
const MUSIC_FOLDER = "music/";
function musicBase(part) {
  const parts = typeof MUSIC_PARTS !== "undefined" ? MUSIC_PARTS : {};
  let base = parts[part || 1] || MUSIC_FOLDER;
  if (!base.endsWith("/")) base += "/";
  return base;
}
const list = typeof SONGS !== "undefined" ? SONGS : [];
const res = { miss: [], broke: [], ok: [] };
const slow = [];   // songs that timed out the first time; checked again one at a time at the end
let done = 0;

function item(s, url, note) {
  const li = document.createElement("li");
  li.textContent = s.file;
  const sm = document.createElement("small");
  sm.textContent = "Part " + (s.part || 1) + (note ? ". " + note : "") + ". " + decodeURIComponent(url);
  li.append(sm);
  return li;
}

function mb(bytes) { return (bytes / 1048576).toFixed(1) + " MB"; }

// Loads the start of the song in a hidden player to see if it really plays
function playable(url, wait = 25000) {
  return new Promise(resolve => {
    const a = new Audio();
    let finished = false;
    const end = r => { if (finished) return; finished = true; clearTimeout(t); a.removeAttribute("src"); a.load(); resolve(r); };
    const t = setTimeout(() => end({ ok: false, why: "took too long to load", slow: true }), wait);
    a.preload = "metadata";
    a.addEventListener("loadedmetadata", () => {
      if (isFinite(a.duration) && a.duration > 5) end({ ok: true, duration: a.duration });
      else end({ ok: false, why: "has no proper length" });
    });
    a.addEventListener("error", () => {
      const code = a.error ? a.error.code : 0;
      end({ ok: false, why: code === 3 ? "is damaged and can’t be decoded" : code === 4 ? "isn’t a format the browser can play" : "failed to load" });
    });
    a.src = url;
  });
}

async function check(s, retry = false) {
  const url = musicBase(s.part) + encodeURIComponent(s.file);
  let size = 0;
  try {
    const r = await fetch(url, { method: "HEAD", cache: "no-store" });
    if (!r.ok) { res.miss.push(item(s, url, "Not found (error " + r.status + ")")); return; }
    size = +r.headers.get("content-length") || 0;
  } catch (e) { res.miss.push(item(s, url, "Could not connect")); return; }

  if (size && size < 200 * 1024) { res.broke.push(item(s, url, "File is only " + mb(size) + ", so the upload probably didn’t finish")); return; }
  const p = await playable(url, retry ? 60000 : 25000);
  if (!p.ok && p.slow && !retry) { slow.push(s); return; }
  if (!p.ok) { res.broke.push(item(s, url, "File exists" + (size ? " (" + mb(size) + ")" : "") + " but " + p.why)); return; }
  const m = Math.floor(p.duration / 60), sec = String(Math.floor(p.duration % 60)).padStart(2, "0");
  res.ok.push(item(s, url, (size ? mb(size) + ", " : "") + m + ":" + sec));
}

async function run() {
  if (!list.length) { document.getElementById("status").textContent = "No songs found. Is songs.js uploaded next to this page?"; return; }
  const queue = list.slice();
  const workers = Array.from({ length: 4 }, async () => {
    while (queue.length) {
      await check(queue.shift());
      done++;
      document.getElementById("status").textContent = "Checked " + done + " of " + list.length + "…";
    }
  });
  await Promise.all(workers);
  // Second chance for slow songs: one at a time, with more time, so they don't compete with each other
  for (let k = 0; k < slow.length; k++) {
    document.getElementById("status").textContent = "Checking slow songs again (" + (k + 1) + " of " + slow.length + ")…";
    await check(slow[k], true);
  }
  const problems = res.miss.length + res.broke.length;
  document.getElementById("status").textContent = "Done. " + res.ok.length + " of " + list.length + " songs play fine" + (problems ? ", " + problems + " need attention." : ".");
  document.getElementById("missTitle").textContent = res.miss.length ? "Missing (" + res.miss.length + ")" : "Nothing missing";
  document.getElementById("brokeTitle").textContent = res.broke.length ? "Found but won’t play (" + res.broke.length + ")" : "Nothing broken";
  document.getElementById("okTitle").textContent = "Playing fine (" + res.ok.length + ")";
  for (const k of ["miss", "broke", "ok"]) res[k].forEach(li => document.getElementById(k).append(li));
}
run();
</script>
</body>
</html>
